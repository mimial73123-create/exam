<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LeadPredictor</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <div class="logo">LeadPredictor</div>
        </div>

        <!-- Left Panel - Settings -->
        <div class="left-panel">
            <div class="settings-section">
                <label>Language</label>
                <select id="language">
                    <option value="en">🇺🇸 English</option>
                    <option value="bg">🇧🇬 Български</option>
                </select>
            </div>

            <div class="settings-section">
                <label>Currency</label>
                <select id="currency">
                    <option value="usd">$ US Dollar</option>
                    <option value="eur">€ Euro</option>
                    <option value="bgn">лв BGN</option>
                </select>
            </div>

            <div class="settings-section">
                <label>Campaign Start</label>
                <input type="date" id="campaignStart" value="2026-05-08">
            </div>

            <div class="settings-section">
                <label>Campaign End</label>
                <input type="date" id="campaignEnd" value="2026-11-04">
            </div>

            <div class="settings-section">
                <label>Total Revenue</label>
                <input type="number" id="totalRevenue" value="10000" min="0">
            </div>

            <div class="settings-section">
                <label>Avg. Order Value</label>
                <input type="number" id="avgOrderValue" value="1000" min="0">
            </div>
        </div>

        <!-- Center Panel - Chart -->
        <div class="center-panel">
            <h3>Month-by-Month Breakdown</h3>
            <div class="chart-container">
                <svg id="chart" viewBox="0 0 800 400" class="chart"></svg>
            </div>
            <div class="sliders-section">
                <div class="slider-group">
                    <label>Lead Response Rate</label>
                    <div class="slider-wrapper">
                        <input type="range" id="leadResponseRate" min="0" max="100" value="40">
                        <span class="percentage" id="leadResponseDisplay">40.00%</span>
                    </div>
                </div>
                <div class="slider-group">
                    <label>Prospect Response Rate</label>
                    <div class="slider-wrapper">
                        <input type="range" id="prospectResponseRate" min="0" max="100" value="20">
                        <span class="percentage" id="prospectResponseDisplay">20.00%</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Right Panel - Metrics -->
        <div class="right-panel">
            <div class="metric-card">
                <div class="metric-header">
                    <span class="metric-icon">📋</span>
                    <span class="metric-title">Prospects</span>
                    <span class="metric-percentage">100%</span>
                </div>
                <div class="metric-value" id="prospectsValue">125</div>
                <div class="metric-bar">
                    <div class="metric-bar-fill" style="width: 100%"></div>
                </div>
            </div>

            <div class="metric-card">
                <div class="metric-header">
                    <span class="metric-icon">👤</span>
                    <span class="metric-title">Leads</span>
                    <span class="metric-percentage" id="leadsPercentage">20%</span>
                </div>
                <div class="metric-value" id="leadsValue">25</div>
                <div class="metric-bar">
                    <div class="metric-bar-fill" id="leadsBarFill" style="width: 20%"></div>
                </div>
            </div>

            <div class="metric-card">
                <div class="metric-header">
                    <span class="metric-icon">👥</span>
                    <span class="metric-title">Customers</span>
                    <span class="metric-percentage" id="customersPercentage">8%</span>
                </div>
                <div class="metric-value" id="customersValue">10</div>
                <div class="metric-bar">
                    <div class="metric-bar-fill" id="customersBarFill" style="width: 8%"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="index.js"></script>
</body>
</html>
